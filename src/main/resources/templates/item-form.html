<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${id} ? '商品編集' : '商品新規登録'">商品登録</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="page">
		<h1 class="page-title" th:text="${id} ? '商品編集' : '商品新規登録'">商品登録</h1>

		<div class="card">
			<p class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

			<form th:action="${id} ? @{/items/{id}(id=${id})} : @{/items}" th:object="${item}" method="post">
				<div class="form-group">
					<label for="barcode">商品コード</label>
					<input type="text" id="barcode" th:field="*{barcode}" required>
					<p class="message error" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></p>
				</div>
				<div class="form-group">
					<label for="name">商品名</label>
					<input type="text" id="name" th:field="*{name}" required>
					<p class="message error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
				</div>
				<div class="form-group">
					<label for="price">価格（円）</label>
					<input type="number" id="price" th:field="*{price}" min="0" required>
					<p class="message error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
				</div>
				<div class="form-group">
					<label for="stock">在庫数</label>
					<input type="number" id="stock" th:field="*{stock}" min="0" required>
					<p class="message error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>
				</div>
				<div class="form-row">
					<button type="submit" class="btn gold">保存</button>
					<a th:href="@{/items}" class="btn outline">戻る</a>
				</div>
			</form>
		</div>
	</main>
</body>
</html>
