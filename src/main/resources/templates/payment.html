<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>お支払い | Belle Fleur Cosme</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="page">
		<h1 class="page-title">お支払い</h1>

		<div class="card">
			<p class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

			<div class="total-box">
				ご請求金額: <span class="amount" th:text="${cart.total} + '円'"></span>
			</div>

			<form th:action="@{/pos/checkout}" method="post">
				<div class="form-group">
					<label for="receivedAmount">お預かり金額</label>
					<input type="number" id="receivedAmount" name="receivedAmount" min="0" required
						th:attr="data-total=${cart.total}" oninput="updateChange()">
				</div>
				<div class="form-group">
					<label>お釣り</label>
					<div id="changeDisplay" class="total-box" style="margin:0;">-</div>
				</div>
				<div class="form-row">
					<button type="submit" class="btn large gold">支払い確定</button>
					<a th:href="@{/pos}" class="btn outline">戻る</a>
				</div>
			</form>
		</div>
	</main>

	<script th:inline="javascript">
		function updateChange() {
			var input = document.getElementById('receivedAmount');
			var total = parseInt(input.getAttribute('data-total'), 10);
			var received = parseInt(input.value, 10);
			var display = document.getElementById('changeDisplay');
			if (isNaN(received) || received < total) {
				display.textContent = '-';
				return;
			}
			display.textContent = (received - total) + '円';
		}
	</script>
</body>
</html>
