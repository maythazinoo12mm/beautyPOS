spring.application.name=beautyPOS

# PostgreSQL（本番想定）。環境変数で上書き可能（デフォルトはローカル開発用の値）
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beautypos}
spring.datasource.username=${DB_USERNAME:beautypos_user}
spring.datasource.password=${DB_PASSWORD:beautypos_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# スキーマはFlywayで管理するため、Hibernateは検証のみ行う（自動生成しない）
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flywayでスキーマ・初期データを投入する（data.sqlによる初期化は無効化）
spring.flyway.enabled=true
spring.sql.init.mode=never
